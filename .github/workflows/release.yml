name: Build and Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
      - if: runner.os == 'macOS'
        run: bash ./build.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          draft: true
          generate_release_notes: true
