name: Cloud
on:
  pull_request:
    paths: ['cloud/**', 'src/**', '.github/workflows/cloud.yml']
  push:
    branches: [master, main]
    paths: ['cloud/**', 'src/**', '.github/workflows/cloud.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test API (Testcontainers PostgreSQL)
        run: mvn -B -f cloud/api/pom.xml verify
  web:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json
      - run: npm ci
        working-directory: cloud/web
      - run: npm run build
        working-directory: cloud/web
  image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Build container image
        run: docker build -f cloud/Dockerfile -t cardbox-trading:ci .
